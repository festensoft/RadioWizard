# =============================================================================
# RadioWizard CI — same CMake workflow presets as local development
# =============================================================================
# Jobs map 1:1 to cmake --workflow --preset <name>:
#   debug-asan  — Debug + ASan/UBSan + ctest  (primary quality gate)
#   release     — optimized build
# Local-only for now: debug-tsan, debug-clang-tidy
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ===========================================================================
  # Debug + ASan/UBSan + tests
  # ===========================================================================
  debug-asan:
    name: debug-asan (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cppstd: gnu20
          - os: macos-latest
            cppstd: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake 4.1+
        if: runner.os == 'Linux'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.1.x'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3-pip \
            libsoapysdr-dev \
            libgl-dev \
            xkb-data

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja soapysdr

      - name: Install Conan
        run: |
          pip3 install conan --break-system-packages
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install dependencies with Conan
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=${{ matrix.cppstd }} \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Configure, build, and test (debug-asan)
        run: cmake --workflow --preset debug-asan

  # ===========================================================================
  # Release build
  # ===========================================================================
  release:
    name: release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cppstd: gnu20
          - os: macos-latest
            cppstd: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install CMake 4.1+
        if: runner.os == 'Linux'
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.1.x'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ninja-build \
            python3-pip \
            libsoapysdr-dev \
            libgl-dev \
            xkb-data

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake ninja soapysdr

      - name: Install Conan
        run: |
          pip3 install conan --break-system-packages
          conan profile detect --force

      - name: Cache Conan packages
        uses: actions/cache@v4
        with:
          path: ~/.conan2
          key: ${{ runner.os }}-conan-${{ hashFiles('conanfile.py') }}
          restore-keys: |
            ${{ runner.os }}-conan-

      - name: Install dependencies with Conan
        run: |
          conan install . \
            --output-folder=build \
            --build=missing \
            -s build_type=Release \
            -s compiler.cppstd=${{ matrix.cppstd }} \
            -c tools.system.package_manager:mode=install \
            -c tools.system.package_manager:sudo=True

      - name: Configure and build (release)
        run: cmake --workflow --preset release
